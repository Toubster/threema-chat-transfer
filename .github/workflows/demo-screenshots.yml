# SPDX-License-Identifier: AGPL-3.0-or-later
# Demo screenshots (DESIGN §13.1 level 7, §15): the real app with the real engine and the virtual iPhone in demo mode
# ("DEMO" watermark) produces every app screenshot of docs/images/screenshots.json in German and English
# (devtools/demo_screenshots.py drives the app with its demo autopilot; no UI automation permission needed). The images
# get the scrub marker tm-demo=1, are listed in the allowlist block "demo screenshots" and arrive as a pull request for
# review. Manual only. Contains no real data by construction (fake device, synthetic fixtures).
name: demo-screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-screenshots
  cancel-in-progress: true

env:
  CI_STRICT: "1"
  XCODE_APP: /Applications/Xcode_16.4.app
  APP_PROJECT: app/ThreemaChatTransfer.xcodeproj
  APP_SCHEME: ThreemaChatTransfer
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    shell: bash

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write          # push the screenshot branch
      pull-requests: write     # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  scrub:ok sha1
        with:
          persist-credentials: true   # this workflow pushes one branch
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0  scrub:ok sha1
        with:
          python-version: "3.13"
      - name: components present (always strict here)
        run: |
          .github/scripts/gate.sh "demo screenshots" app/project.yml packaging/fetch-python.sh packaging/build-core.sh \
            packaging/build-importer.sh
      - name: select Xcode, install XcodeGen
        run: |
          sudo xcode-select -s "${XCODE_APP}" && xcodebuild -version
          brew install xcodegen
      - uses: ./.github/actions/core-env
      - name: media tools of the synthetic Android fixture (ffmpeg; afconvert ships with macOS)
        run: brew install ffmpeg
      - name: signed app with the bundled engine (runtime, core, importer, model)
        run: make app PY="${PY}"
      - name: screenshots DE + EN (real app, real engine, virtual iPhone; demo autopilot, no UI automation)
        run: '"${PY}" devtools/demo_screenshots.py --out "${RUNNER_TEMP}/shots" --install'
      - name: complete set, marker, allowlist, scrub
        run: |
          "${PY}" docs/tools/check_docs.py --screenshots-dir "${RUNNER_TEMP}/shots"
          "${PY}" .github/scripts/mark_png.py --check docs/images/app/*/*.png
          "${PY}" scripts/scrub_check.py --layer 1 --paths docs/images scripts/scrub-allowlist.txt
          "${PY}" docs/tools/check_docs.py --require-images app
      - name: pull request with the new screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="demo-screenshots/${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add docs/images/app scripts/scrub-allowlist.txt
          if git diff --cached --quiet; then echo "::notice::screenshots unchanged"; exit 0; fi
          git commit -m "docs: demo-mode screenshots (run ${RUN_ID})" -m "Generated by demo-screenshots.yml in demo mode (virtual iPhone, synthetic data); marker tm-demo=1."
          git push origin "${branch}"
          gh pr create --head "${branch}" --title "Demo screenshots (run ${RUN_ID})" \
            --body "Generated in demo mode (virtual iPhone, synthetic data). Please look at every picture before merging. Scrub layer 1 passed in CI; run layer 2 locally before merging."
